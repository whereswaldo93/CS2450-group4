<h1>Create a Note for Task {{ task.title }}</h1>
<form method="post">
    {% csrf_token %}

    <label for="notes">Notes:</label><br>
    <textarea name="notes" rows="5" cols="40">{{ task.notes }}</textarea><br><br>

    <button type="submit">Save Note</button>
</form>

<a href="{% url 'task_list' %}">Back to Task List</a>
